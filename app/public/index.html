<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Projetos</title>
  <meta name="description" content="Acompanhe o status dos seus projetos com transparência: progresso, marcos, entregáveis, documentos e atividades.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 17l4 4 10-10' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Aplica o tema salvo antes da primeira pintura para evitar "flash" de tema.
    try {
      var t = localStorage.getItem('portal-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* armazenamento indisponível: segue o tema do sistema */ }
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" class="toasts" role="status" aria-live="assertive"></div>
  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title">Confirmar ação</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost" type="submit">Cancelar</button>
        <button value="confirm" class="btn btn-danger" type="submit" id="confirm-ok">Confirmar</button>
      </div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
